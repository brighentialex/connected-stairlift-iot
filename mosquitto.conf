# Configurazione minima del broker Mosquitto per la demo in locale.
#
# COSA FA:
#  - apre una "porta" (1883, la porta standard MQTT) solo sul tuo PC (127.0.0.1 = localhost)
#  - permette connessioni senza username/password (comodo per la demo; NON per la produzione)
#
# COME USARLA (in un terminale, dentro la cartella del progetto):
#     mosquitto -c mosquitto.conf -v
#
# Il flag -v ("verbose") fa stampare a video ogni messaggio che passa: utile per capire
# cosa succede e da mostrare durante la demo.

listener 1883 127.0.0.1
allow_anonymous true
